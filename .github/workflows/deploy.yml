name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the pnpm version from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Ask GitHub where the site is actually served:
      #   repo "<owner>.github.io" or a custom domain -> base_path ""      -> "/"
      #   any other repo name                         -> base_path "/repo" -> "/repo/"
      - id: pages
        uses: actions/configure-pages@v5

      - name: Set the base URL
        run: |
          BASE="${{ steps.pages.outputs.base_path }}/"
          echo "NUXT_APP_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "Base URL: $BASE"

      - run: pnpm install --frozen-lockfile
      - run: pnpm generate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
